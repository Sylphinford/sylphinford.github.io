<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Webhook 消息发送器 · 简化版</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="top">
<main class="wrap wide">
  <header class="head head-row">
    <a class="back" href="index.html">&#8592; 所有工具</a>
    <h1 class="title">Webhook 消息发送器</h1>
    <div class="head-actions">
      <a class="badge" href="webhook.html">完整版</a>
      <button class="btn sm primary" onclick="openAddModal()">＋ 添加 Webhook</button>
    </div>
  </header>

  <div class="tab-strip" id="webhookTabs"></div>

  <!-- 消息发送区域 -->
  <div class="card hidden" id="messageArea">
    <div class="form-row">
      <label class="label" for="messageInput">消息内容</label>
      <div class="input-wrap">
        <textarea class="input" id="messageInput" rows="5" placeholder="请输入要发送的消息内容..."></textarea>
        <span class="counter"><span id="charCount">0</span> / 2000</span>
      </div>
    </div>

    <div class="form-row">
      <div class="between">
        <span class="label">附件</span>
        <span class="sub" id="attachmentCount">0张图片</span>
      </div>
      <div class="attachments">
        <div id="attachmentsContainer" class="contents"></div>
        <div class="attachment-add" onclick="document.getElementById('fileInput').click()">
          <span class="ico">＋</span>
          <span>添加图片</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)">
      </div>
      <p class="sub" style="margin-top:10px">支持拖拽图片、粘贴剪贴板图片或点击添加图片</p>
    </div>

    <div class="divider"></div>
    <div class="between">
      <span class="sub" id="totalSize">总大小: 0KB</span>
      <div class="row">
        <button class="btn sm" onclick="clearForm()">清空</button>
        <button class="btn sm primary" onclick="sendMessage()">发送消息</button>
      </div>
    </div>
  </div>

  <!-- 空状态 -->
  <div class="card" id="emptyState">
    <div class="empty">
      <div class="ico">＋</div>
      <h2>还没有添加任何 Webhook</h2>
      <p>点击右上角的「添加 Webhook」按钮开始使用</p>
      <button class="btn primary" onclick="openAddModal()">添加第一个 Webhook</button>
    </div>
  </div>

  <footer class="foot">
    <span>数据仅保存在本机浏览器</span>
    <a class="linkbtn" href="index.html">返回工具列表</a>
  </footer>
</main>

<!-- 添加 Webhook 模态框 -->
<div class="modal hidden" id="addWebhookModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>添加 Webhook</h2>
      <button class="icon-btn" aria-label="关闭" onclick="closeAddModal()">&times;</button>
    </div>
    <form id="webhookForm">
      <div class="modal-body">
        <div class="form-row">
          <label class="label" for="webhookAlias">别名</label>
          <input class="input" type="text" id="webhookAlias" placeholder="例如：通知系统、日志服务" required>
        </div>
        <div class="form-row">
          <label class="label" for="webhookUrl">Webhook 地址</label>
          <input class="input" type="url" id="webhookUrl" placeholder="https://example.com/webhook" required>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn sm" onclick="closeAddModal()">取消</button>
        <button type="submit" class="btn sm primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 提示消息 -->
<div class="toast success translate-y-20 opacity-0" id="successToast">
  <span class="ico">&#10003;</span>
  <span id="successMessage">操作成功！</span>
</div>
<div class="toast error translate-y-20 opacity-0" id="errorToast">
  <span class="ico">!</span>
  <span id="errorMessage">操作失败，请重试</span>
</div>

    <script>
        // 全局变量
        let webhooks = JSON.parse(localStorage.getItem('webhooks') || '[]');
        let currentWebhook = null;
        let attachments = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('WebhookSender 简化版 初始化');
            
            // 绑定表单提交事件
            document.getElementById('webhookForm').addEventListener('submit', saveWebhook);
            
            // 绑定文本输入事件
            document.getElementById('messageInput').addEventListener('input', updateCharCount);
            document.getElementById('messageInput').addEventListener('paste', handlePaste);
            
            // 绑定拖拽事件
            const messageArea = document.getElementById('messageArea');
            messageArea.addEventListener('dragover', handleDragOver);
            messageArea.addEventListener('drop', handleDrop);
            messageArea.addEventListener('dragleave', handleDragLeave);
            
            // 初始化界面
            renderWebhookTabs();
            checkEmptyState();
            updateAttachmentStats();
            
            // 如果有保存的webhook，默认选中第一个
            if (webhooks.length > 0) {
                selectWebhook(webhooks[0].id);
            }
            
            showToast('WebhookSender 简化版 已加载', 'success');
        });

        // 渲染Webhook标签
        function renderWebhookTabs() {
            const tabsContainer = document.getElementById('webhookTabs');
            tabsContainer.innerHTML = '';

            webhooks.forEach(webhook => {
                const tab = document.createElement('div');
                tab.className = `wh-tab ${
                    currentWebhook === webhook.id ? 'is-active' : ''
                }`;
                tab.dataset.id = webhook.id;
                tab.innerHTML = `
                    <span>${webhook.alias}</span>
                    <button class="x" aria-label="删除" onclick="deleteWebhook('${webhook.id}', event)">&times;</button>
                `;
                
                tab.addEventListener('click', () => selectWebhook(webhook.id));
                tabsContainer.appendChild(tab);
            });
        }

        // 选择Webhook
        function selectWebhook(id) {
            console.log('选择Webhook:', id);
            currentWebhook = id;
            document.getElementById('messageArea').classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            renderWebhookTabs();
        }

        // 打开添加Webhook模态框
        function openAddModal() {
            const modal = document.getElementById('addWebhookModal');
            modal.classList.remove('hidden');
            
            // 清空表单
            document.getElementById('webhookForm').reset();
        }

        // 关闭添加Webhook模态框
        function closeAddModal() {
            const modal = document.getElementById('addWebhookModal');
            modal.classList.add('hidden');
        }

        // 保存Webhook
        function saveWebhook(e) {
            e.preventDefault();
            
            const alias = document.getElementById('webhookAlias').value.trim();
            const url = document.getElementById('webhookUrl').value.trim();
            
            if (!alias || !url) {
                showToast('请填写完整信息', 'error');
                return;
            }
            
            const newWebhook = {
                id: Date.now().toString(),
                alias,
                url
            };
            
            webhooks.push(newWebhook);
            localStorage.setItem('webhooks', JSON.stringify(webhooks));
            
            closeAddModal();
            selectWebhook(newWebhook.id);
            renderWebhookTabs();
            checkEmptyState();
            showToast('Webhook 添加成功', 'success');
        }

        // 删除Webhook
        function deleteWebhook(id, event) {
            event.stopPropagation();
            
            if (confirm('确定要删除这个Webhook吗？')) {
                webhooks = webhooks.filter(webhook => webhook.id !== id);
                localStorage.setItem('webhooks', JSON.stringify(webhooks));
                
                if (currentWebhook === id) {
                    currentWebhook = null;
                    document.getElementById('messageArea').classList.add('hidden');
                }
                
                renderWebhookTabs();
                checkEmptyState();
                showToast('Webhook 删除成功', 'success');
            }
        }

        // 检查空状态
        function checkEmptyState() {
            if (webhooks.length === 0) {
                document.getElementById('messageArea').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }

        // 更新字符计数
        function updateCharCount() {
            const input = document.getElementById('messageInput');
            const charCount = document.getElementById('charCount');
            const maxLength = 2000;
            
            const count = input.value.length;
            charCount.textContent = count;
            
            if (count > maxLength) {
                charCount.classList.add('text-danger');
                input.value = input.value.substring(0, maxLength);
                charCount.textContent = maxLength;
            } else {
                charCount.classList.remove('text-danger');
            }
        }

        // 处理粘贴
        function handlePaste(e) {
            try {
                const clipboardData = e.clipboardData || e.originalEvent?.clipboardData;
                if (!clipboardData) return;
                
                const items = clipboardData.items;
                if (!items || items.length === 0) return;
                
                for (const item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) {
                            addAttachment(file);
                            showToast('图片粘贴成功', 'success');
                        }
                    }
                }
            } catch (error) {
                console.error('粘贴处理失败:', error);
                showToast('粘贴图片失败: ' + error.message, 'error');
            }
        }

        // 处理文件选择
        function handleFileSelect(event) {
            const files = event.target.files;
            if (files.length > 0) {
                for (const file of files) {
                    if (file.type.startsWith('image/')) {
                        addAttachment(file);
                    }
                }
                showToast(`成功添加 ${files.length} 张图片`, 'success');
                event.target.value = ''; // 重置input
            }
        }

        // 处理拖拽悬停
        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const messageArea = document.getElementById('messageArea');
            messageArea.classList.add('border-2', 'border-primary/50', 'bg-primary/5');
        }

        // 处理拖拽离开
        function handleDragLeave() {
            const messageArea = document.getElementById('messageArea');
            messageArea.classList.remove('border-2', 'border-primary/50', 'bg-primary/5');
        }

        // 处理拖拽放下
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            
            handleDragLeave();
            
            const files = e.dataTransfer.files;
            let addedCount = 0;
            
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    addedCount++;
                    addAttachment(file);
                }
            }
            
            if (addedCount > 0) {
                showToast(`成功添加 ${addedCount} 张图片`, 'success');
            }
        }

        // 添加附件
        function addAttachment(file) {
            try {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        const result = e.target.result;
                        if (!result || !result.startsWith('data:')) {
                            throw new Error('无效的图片数据');
                        }
                        
                        const attachment = {
                            id: Date.now().toString(),
                            url: result,
                            name: file.name,
                            size: file.size,
                            file: file
                        };
                        
                        attachments.push(attachment);
                        renderAttachments();
                        updateAttachmentStats();
                        
                        console.log('附件添加成功:', attachment.name);
                    } catch (error) {
                        console.error('附件处理失败:', error);
                        showToast('图片添加失败: ' + error.message, 'error');
                    }
                };
                
                reader.onerror = function(error) {
                    console.error('文件读取失败:', error);
                    showToast('图片读取失败', 'error');
                };
                
                reader.readAsDataURL(file);
            } catch (error) {
                console.error('添加附件失败:', error);
                showToast('图片添加失败: ' + error.message, 'error');
            }
        }

        // 渲染附件
        function renderAttachments() {
            const container = document.getElementById('attachmentsContainer');
            container.innerHTML = '';
            
            attachments.forEach(attachment => {
                const item = document.createElement('div');
                item.className = 'attachment-item';
                
                // 创建图片元素
                const img = document.createElement('img');
                img.src = attachment.url;
                img.alt = attachment.name;
                img.className = 'attachment-preview';
                
                // 图片加载失败处理
                img.onerror = function() {
                    this.style.display = 'none';
                    item.innerHTML += `
                        <div class="file-fallback">
                            <div>${attachment.name}</div>
                            <div>${(attachment.size / 1024).toFixed(1)}KB</div>
                        </div>
                    `;
                };
                
                item.appendChild(img);
                
                // 删除按钮
                const removeBtn = document.createElement('div');
                removeBtn.className = 'attachment-remove';
                removeBtn.onclick = () => removeAttachment(attachment.id);
                removeBtn.innerHTML = '&times;';
                
                item.appendChild(removeBtn);
                container.appendChild(item);
            });
        }

        // 移除附件
        function removeAttachment(id) {
            attachments = attachments.filter(att => att.id !== id);
            renderAttachments();
            updateAttachmentStats();
            showToast('图片已移除', 'success');
        }

        // 更新附件统计信息
        function updateAttachmentStats() {
            const attachmentCount = document.getElementById('attachmentCount');
            const totalSize = document.getElementById('totalSize');
            
            const count = attachments.length;
            const size = attachments.reduce((sum, att) => sum + att.size, 0);
            
            attachmentCount.textContent = `${count}张图片`;
            totalSize.textContent = `总大小: ${(size / 1024).toFixed(1)}KB`;
        }

        // 清空表单
        function clearForm() {
            document.getElementById('messageInput').value = '';
            attachments = [];
            updateCharCount();
            renderAttachments();
            updateAttachmentStats();
            showToast('表单已清空', 'success');
        }

        // 发送消息
        async function sendMessage() {
            const message = document.getElementById('messageInput').value.trim();
            if (!message && attachments.length === 0) {
                showToast('请输入消息内容或添加附件', 'error');
                return;
            }
            
            if (!currentWebhook) {
                showToast('请先选择一个Webhook', 'error');
                return;
            }
            
            const webhook = webhooks.find(w => w.id === currentWebhook);
            if (!webhook) {
                showToast('未找到选中的Webhook', 'error');
                return;
            }
            
            // 显示发送状态
            const sendBtn = event.target.closest('button');
            const originalText = sendBtn.innerHTML;
            sendBtn.innerHTML = '发送中…';
            sendBtn.disabled = true;
            
            try {
                let response;
                
                if (attachments.length > 0) {
                    // 使用FormData格式发送
                    const formData = new FormData();
                    formData.append('content', message);
                    
                    // 添加附件
                    attachments.forEach((att, index) => {
                        formData.append(`attachment_${index}`, att.file, att.name);
                    });
                    
                    // 发送请求
                    response = await fetch(webhook.url, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    // 纯文本消息，使用JSON格式
                    const data = {
                        content: message
                    };
                    
                    // 发送请求
                    response = await fetch(webhook.url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });
                }
                
                if (!response.ok) {
                    const errorText = await response.text().catch(() => '');
                    throw new Error(`HTTP error! status: ${response.status} ${errorText}`);
                }
                
                showToast('消息发送成功！', 'success');
                clearForm();
            } catch (error) {
                console.error('发送失败:', error);
                showToast('发送失败: ' + error.message, 'error');
            } finally {
                // 恢复按钮状态
                sendBtn.innerHTML = originalText;
                sendBtn.disabled = false;
            }
        }

        // 显示提示消息
        function showToast(message, type = 'success') {
            const toast = type === 'success' ? 
                document.getElementById('successToast') : 
                document.getElementById('errorToast');
                
            const messageElement = type === 'success' ? 
                document.getElementById('successMessage') : 
                document.getElementById('errorMessage');
            
            messageElement.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
