<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>鼠标功能测试 · 小工具</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<main class="wrap mid">
  <header class="head">
    <a class="back" href="index.html">&#8592; 所有工具</a>
    <h1 class="title">鼠标功能测试</h1>
  </header>

  <div class="card">
    <div class="between">
      <p class="sub">在下方区域点击、滚动，观察计数变化。</p>
      <button class="btn sm" id="resetBtn">重置</button>
    </div>

    <div id="testArea" class="test-pad" style="margin-top:16px">鼠标放在这里</div>

    <div class="split" style="margin-top:22px">
      <div>
        <h2 class="section-label">按键 / 侧键 / 横向滚动</h2>
        <div class="stat-list">
          <div class="stat"><span class="k">左键</span><span class="v" id="leftCount">0</span></div>
          <div class="stat"><span class="k">右键</span><span class="v" id="rightCount">0</span></div>
          <div class="stat"><span class="k">中键</span><span class="v" id="middleCount">0</span></div>
          <div class="stat"><span class="k">滚轮向左</span><span class="v" id="wheelLeftCount">0</span></div>
          <div class="stat"><span class="k">滚轮向右</span><span class="v" id="wheelRightCount">0</span></div>
          <div class="stat"><span class="k">前进键</span><span class="v" id="forwardCount">0</span></div>
          <div class="stat"><span class="k">后退键</span><span class="v" id="backCount">0</span></div>
        </div>
      </div>

      <div>
        <h2 class="section-label">纵向滚轮占比</h2>
        <div class="stat-list">
          <div class="stat">
            <span class="k">向上</span>
            <span class="v"><span id="wheelUpCount">0</span><small id="wheelUpPercent">0%</small></span>
          </div>
          <div class="stat">
            <span class="k">向下</span>
            <span class="v"><span id="wheelDownCount">0</span><small id="wheelDownPercent">0%</small></span>
          </div>
          <div class="stat total"><span class="k">总共</span><span class="v" id="wheelTotalCount">0</span></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">
    <span>右键菜单与浏览器侧键导航已在测试区内屏蔽</span>
    <a class="linkbtn" href="index.html">返回工具列表</a>
  </footer>
</main>

<script>
        // 获取DOM元素
        const leftCount = document.getElementById('leftCount');
        const rightCount = document.getElementById('rightCount');
        const middleCount = document.getElementById('middleCount');
        const wheelLeftCount = document.getElementById('wheelLeftCount');
        const wheelRightCount = document.getElementById('wheelRightCount');
        const forwardCount = document.getElementById('forwardCount');
        const backCount = document.getElementById('backCount');

        const wheelUpCount = document.getElementById('wheelUpCount');
        const wheelUpPercent = document.getElementById('wheelUpPercent');
        const wheelDownCount = document.getElementById('wheelDownCount');
        const wheelDownPercent = document.getElementById('wheelDownPercent');
        const wheelTotalCount = document.getElementById('wheelTotalCount');

        const testArea = document.getElementById('testArea');
        const resetBtn = document.getElementById('resetBtn');

        // 初始化计数器
        let leftClick = 0, rightClick = 0, middleClick = 0;
        let wheelLeft = 0, wheelRight = 0;
        let forwardClick = 0, backClick = 0;
        let wheelUp = 0, wheelDown = 0;

        // 更新显示
        function updateDisplay() {
            // 更新点击测试显示
            leftCount.textContent = leftClick;
            rightCount.textContent = rightClick;
            middleCount.textContent = middleClick;
            wheelLeftCount.textContent = wheelLeft;
            wheelRightCount.textContent = wheelRight;
            forwardCount.textContent = forwardClick;
            backCount.textContent = backClick;

            // 更新滚轮测试显示
            const totalWheel = wheelUp + wheelDown;
            wheelUpCount.textContent = wheelUp;
            wheelDownCount.textContent = wheelDown;
            wheelTotalCount.textContent = totalWheel;

            if (totalWheel > 0) {
                const upPercent = Math.round((wheelUp / totalWheel) * 100);
                const downPercent = 100 - upPercent;
                wheelUpPercent.textContent = upPercent + '%';
                wheelDownPercent.textContent = downPercent + '%';
            } else {
                wheelUpPercent.textContent = '0%';
                wheelDownPercent.textContent = '0%';
            }
        }

        // 侧键前进/后退是浏览器的历史记录命令，事件里的 preventDefault 拦截无效。
        // 做法：指针位于测试区期间预埋一条同 URL 的历史记录，侧键只会消费掉这条记录，
        // 导航时再补回去；离开测试区后移除，恢复浏览器正常的前进/后退。
        let navGuardArmed = false;
        let navGuardTimer = 0;
        let lastSidePress = 0;
        let pointerInside = false;

        function armNavGuard() {
            if (navGuardArmed) return;
            try {
                history.pushState({ mouseTestGuard: true }, '', location.href);
            } catch (_) {
                return; // file:// 等不支持 pushState 的场景，只能放弃屏蔽
            }
            navGuardArmed = true;
        }

        function releaseNavGuardSoon() {
            clearTimeout(navGuardTimer);
            if (!navGuardArmed) return;
            navGuardTimer = setTimeout(() => {
                if (!navGuardArmed) return;
                navGuardArmed = false;
                history.back();
            }, 1200);
        }

        window.addEventListener('popstate', () => {
            navGuardArmed = false;
            // 刚在测试区按过侧键，说明这次导航由侧键触发：补回记录，留在本页
            if (Date.now() - lastSidePress < 800) {
                armNavGuard();
            }
            if (!pointerInside) {
                releaseNavGuardSoon();
            }
        });

        testArea.addEventListener('mouseenter', () => {
            pointerInside = true;
            clearTimeout(navGuardTimer);
            armNavGuard();
        });

        testArea.addEventListener('mouseleave', () => {
            pointerInside = false;
            releaseNavGuardSoon();
        });

        // 页面加载时指针若已停在测试区内，mouseenter 不会再触发，这里补一次
        if (testArea.matches(':hover')) {
            pointerInside = true;
            armNavGuard();
        }

        // 鼠标按键事件
        testArea.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (e.button === 3 || e.button === 4) {
                lastSidePress = Date.now();
                armNavGuard();
            }
            switch(e.button) {
                case 0: // 左键
                    leftClick++;
                    break;
                case 1: // 中键
                    middleClick++;
                    break;
                case 2: // 右键
                    rightClick++;
                    break;
                case 3: // 后退键
                    backClick++;
                    break;
                case 4: // 前进键
                    forwardClick++;
                    break;
            }
            updateDisplay();
        });

        // 阻止默认行为，避免部分浏览器在释放时触发侧键导航
        testArea.addEventListener('mouseup', (e) => {
            e.preventDefault();
        });

        // 滚轮事件
        testArea.addEventListener('wheel', (e) => {
            e.preventDefault();
            // 处理上下滚动
            if (e.deltaY > 0) {
                wheelDown++;
            } else if (e.deltaY < 0) {
                wheelUp++;
            }
            // 处理左右滚动
            if (e.deltaX > 0) {
                wheelRight++;
            } else if (e.deltaX < 0) {
                wheelLeft++;
            }
            updateDisplay();
        });

        // 阻止右键菜单
        testArea.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 重置按钮事件
        resetBtn.addEventListener('click', () => {
            leftClick = rightClick = middleClick = 0;
            wheelLeft = wheelRight = 0;
            forwardClick = backClick = 0;
            wheelUp = wheelDown = 0;
            updateDisplay();
        });

        // 初始化显示
        updateDisplay();
</script>
</body>
</html>
