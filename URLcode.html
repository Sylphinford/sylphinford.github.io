<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>URL 编码 / 解码 · 小工具</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<main class="wrap mid">
  <header class="head">
    <a class="back" href="index.html">&#8592; 所有工具</a>
    <h1 class="title">URL 编码 / 解码</h1>
  </header>

  <div class="card">
    <div class="split">
      <div class="form-row">
        <label class="label" for="inputText">原始文本</label>
        <textarea class="input" id="inputText" spellcheck="false" placeholder="在此输入需要编码的原始文本..."></textarea>
      </div>
      <div class="form-row">
        <label class="label" for="outputText">编码结果</label>
        <textarea class="input" id="outputText" spellcheck="false" placeholder="在此输入需要解码的 URL 编码文本..."></textarea>
      </div>
    </div>

    <div class="row wrap-row">
      <button class="btn primary auto" id="encodeBtn">编码 &rarr;</button>
      <button class="btn auto" id="decodeBtn">&larr; 解码</button>
      <span class="grow"></span>
      <label class="check"><input type="checkbox" id="encodeSpecial"> 编码所有特殊字符</label>
    </div>

    <div class="divider"></div>
    <p class="sub">不勾选时保留 URL 结构字符（<code>/</code>、<code>?</code>、<code>&amp;</code> 等）；勾选后连这些字符一起转义，适合编码参数值。</p>
  </div>

  <footer class="foot">
    <span>左右文本框互为输入输出</span>
    <a class="linkbtn" href="index.html">返回工具列表</a>
  </footer>
</main>

<script>
    // 获取DOM元素
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const encodeBtn = document.getElementById('encodeBtn');
    const decodeBtn = document.getElementById('decodeBtn');
    const encodeSpecial = document.getElementById('encodeSpecial');

    // 编码功能：将左侧内容编码后输出到右侧
    encodeBtn.addEventListener('click', () => {
        try {
            const rawText = inputText.value;
            const encodedText = encodeSpecial.checked ? encodeURIComponent(rawText) : encodeURI(rawText);
            outputText.value = encodedText;
        } catch (error) {
            alert('编码失败：' + error.message);
        }
    });

    // 解码功能：将右侧内容解码后输出到左侧
    decodeBtn.addEventListener('click', () => {
        try {
            const encodedText = outputText.value;
            const decodedText = encodeSpecial.checked ? decodeURIComponent(encodedText) : decodeURI(encodedText);
            inputText.value = decodedText;
        } catch (error) {
            alert('解码失败，请检查输入的内容是否为合法的URL编码：' + error.message);
        }
    });
</script>
</body>
</html>
