<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小工具 · sylphinford</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
    }
    .card {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.4);
    }
    .card:hover .card-icon {
      transform: scale(1.15);
    }
    .card-icon {
      transition: transform 0.25s ease;
    }
  </style>
</head>
<body class="text-slate-100">

  <!-- 头部 -->
  <header class="max-w-4xl mx-auto px-6 pt-16 pb-10 text-center">
    <h1 class="text-4xl font-bold tracking-tight">
      <i class="fa fa-wrench text-blue-400 mr-2"></i>
      小工具集合
    </h1>
    <p class="mt-3 text-slate-400 text-lg">sylphinford.github.io</p>
    <div class="mt-6 w-24 h-1 bg-blue-500 rounded-full mx-auto"></div>
  </header>

  <!-- 工具卡片 -->
  <main class="max-w-4xl mx-auto px-6 pb-16">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- Webhook 消息发送器 -->
      <a href="webhook.html" class="card block bg-slate-800/60 backdrop-blur rounded-2xl p-6 border border-slate-700 hover:border-blue-500">
        <div class="card-icon text-3xl mb-4">
          <i class="fa fa-paper-plane text-blue-400"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">Webhook 消息发送器</h2>
        <p class="mt-2 text-sm text-slate-400">通过 Webhook 向群聊/频道发送消息</p>
      </a>

      <!-- Webhook 简化版 -->
      <a href="webhooklite.html" class="card block bg-slate-800/60 backdrop-blur rounded-2xl p-6 border border-slate-700 hover:border-blue-500">
        <div class="card-icon text-3xl mb-4">
          <i class="fa fa-comment-o text-cyan-400"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">Webhook 简化版</h2>
        <p class="mt-2 text-sm text-slate-400">轻量版 Webhook 消息发送工具</p>
      </a>

      <!-- URL 编码/解码 -->
      <a href="URLcode.html" class="card block bg-slate-800/60 backdrop-blur rounded-2xl p-6 border border-slate-700 hover:border-blue-500">
        <div class="card-icon text-3xl mb-4">
          <i class="fa fa-link text-emerald-400"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">URL 编码/解码</h2>
        <p class="mt-2 text-sm text-slate-400">URL 编码与解码转换工具</p>
      </a>

      <!-- 鼠标功能测试 -->
      <a href="mousetest.html" class="card block bg-slate-800/60 backdrop-blur rounded-2xl p-6 border border-slate-700 hover:border-blue-500">
        <div class="card-icon text-3xl mb-4">
          <i class="fa fa-mouse-pointer text-amber-400"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">鼠标功能测试</h2>
        <p class="mt-2 text-sm text-slate-400">测试鼠标按键、滚轮及移动</p>
      </a>

      <!-- 计时器 -->
      <a href="timer.html" class="card block bg-slate-800/60 backdrop-blur rounded-2xl p-6 border border-slate-700 hover:border-blue-500">
        <div class="card-icon text-3xl mb-4">
          <i class="fa fa-clock-o text-rose-400"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">计时器</h2>
        <p class="mt-2 text-sm text-slate-400">倒计时 / 正计时 / 秒表</p>
      </a>

    </div>
  </main>

  <!-- 页脚 -->
  <footer class="text-center pb-8 text-slate-500 text-sm">
    <p>&copy; sylphinford · GitHub Pages</p>
  </footer>

</body>
</html>
